<style>
:root{--paper:#f8f5ef;--ink:#403a34;--muted:#8c8277;--line:#e7ded2;--red:#963f50;--pink:#f4e7e7;--white:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;font-size:14px}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent;border-radius:10px;padding:12px 17px;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:3px}button:hover{filter:brightness(.97)}button:disabled{opacity:.5;cursor:wait}input,select{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:12px;width:100%;min-width:0}.primary{background:var(--red);color:white}.secondary{border:1px solid #d9cbbd;background:var(--white)}.tint{background:var(--pink);color:var(--red)}.danger{color:var(--red)}.wide{width:100%;margin-top:12px}header{padding:22px max(22px,calc((100vw - 1050px)/2));border-bottom:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Georgia,serif;color:var(--red);font-size:29px;letter-spacing:3px}.brand small{display:block;font-family:sans-serif;font-size:10px;color:var(--muted);letter-spacing:4px;margin-top:5px}.version{font-size:11px;color:var(--red);background:var(--pink);padding:7px 10px;border-radius:20px;white-space:nowrap}main{max-width:1050px;margin:auto;padding:32px 24px 50px}.banner{font-size:12px;line-height:1.8;color:#7c6650;background:#eee7db;border-radius:12px;padding:14px 18px;margin-bottom:30px}.eyebrow{color:var(--red);font-size:10px;letter-spacing:3px}h1{font-family:Georgia,'Songti SC',serif;font-weight:500;font-size:32px;letter-spacing:1px;line-height:1.4;margin:14px 0}h2{font-weight:500;font-size:19px;line-height:1.5;margin:0 0 10px}h3{font-size:16px;font-weight:500;margin:0 0 10px}p{line-height:1.8}.sub,.hint{font-size:12px;line-height:1.9;color:var(--muted)}.hero{margin:25px 0 30px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin:28px 0 22px}.tabs button{white-space:nowrap;border-radius:0;font-size:13px;color:var(--muted);padding:14px}.tabs .selected{border-bottom:2px solid var(--red);color:var(--red)}.count{font-family:Georgia,serif;font-size:40px;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0;gap:10px}.stat{padding:20px;background:#eee8de;border-radius:13px;text-align:center}.stat strong{font:28px Georgia,serif;display:block;margin-bottom:6px}.stat span{color:var(--muted);font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 18px}.section-head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:15px;overflow:hidden}.card-body{padding:18px}.photo{height:130px;background:#eee9df;display:flex;align-items:center;justify-content:center;position:relative}.photo img{width:100%;height:100%;object-fit:contain;padding:10px}.bottle{width:34px;height:62px;border:2px solid #baaa95;border-radius:8px;position:relative}.bottle:before{content:'';position:absolute;top:-13px;left:8px;width:14px;height:11px;border:2px solid #baaa95;border-radius:3px}.bottle:after{content:'D';position:absolute;inset:17px 0;text-align:center;font:20px Georgia;color:#baaa95}.tag{font-size:10px;padding:5px 8px;border-radius:20px;display:inline-block;background:#eee8de;color:#8d7760;margin-bottom:10px}.tag.rose{background:var(--pink);color:var(--red)}.photo .tag{position:absolute;top:10px;right:10px}.meta{font-size:11px;color:var(--muted);line-height:1.9;margin:8px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.actions button{font-size:11px;padding:9px 12px;flex:1}.empty{text-align:center;padding:45px 24px;border:1px dashed #d6c9b8;border-radius:15px;margin:20px 0}.empty h2{font-size:18px}.empty .mark{font:54px Georgia;color:#b59b83;margin-bottom:10px}.query-row{padding:20px;background:var(--white);border:1px solid var(--line);border-radius:12px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:18px}.query-row h3{margin:0 0 5px}.query-row p{margin:0;font-size:12px;color:var(--muted)}.query-row button{flex-shrink:0}.result-box{border:1px solid var(--line);background:#f3eee5;padding:18px;border-radius:12px;margin:18px 0}.result-box p{font-size:12px}.note{color:var(--red);font-size:12px;line-height:1.8;border-left:2px solid #c6929b;padding-left:12px;margin:20px 0}.back{padding-left:0;color:var(--red);font-size:12px}.summary-list{list-style:none;padding:0}.summary-list li{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line);font-size:13px}.summary-list strong{font-weight:500;color:var(--red)}.callout{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 20px;background:var(--pink);border-radius:12px;font-size:12px;color:var(--red);margin:22px 0}.toolbar{display:flex;gap:12px;margin:20px 0}.toolbar input{flex:1}.toolbar select{max-width:150px}footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:10px;line-height:1.9;color:var(--muted);text-align:center}footer button{font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#453a33;color:white;padding:14px 20px;border-radius:12px;font-size:12px;max-width:90%;z-index:30;line-height:1.7}dialog{border:0;border-radius:19px;padding:25px;background:var(--white);width:calc(100% - 28px);max-width:490px;max-height:90dvh;color:var(--ink)}dialog::backdrop{background:#3b302d66;backdrop-filter:blur(3px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.dialog-head h2{font-size:20px;margin:0}.dialog-head button{padding:8px 12px}.scene{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#f8f4ed;margin:12px 0;padding:20px}.scene strong{font-weight:500;display:block;font-size:15px;margin-bottom:6px}.scene span{font-size:12px;color:var(--muted);line-height:1.8;display:block}.step{font-size:10px;letter-spacing:2px;color:var(--red);margin-bottom:10px}label.field{display:flex;flex-direction:column;gap:9px;font-size:12px;margin:19px 0}fieldset{padding:0;border:0;margin:22px 0;min-width:0}legend{font-size:12px;margin-bottom:12px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{border:1px solid var(--line);padding:10px 13px;font-size:12px}.choices .chosen{border-color:#c68b96;color:var(--red);background:var(--pink)}.choice-stack{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-upload{height:85px;background:#f3ede3;border:1px dashed #d3bfa9;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;color:#99806a;font-size:12px}.photo-upload img{height:100%;max-width:100%;object-fit:contain}.check{font-size:12px;display:flex;align-items:center;gap:9px;line-height:1.8;margin:16px 0}.check input{width:17px;height:17px;accent-color:var(--red)}.error{background:#f7e4e3;padding:12px;border-radius:8px;color:#9c3542;font-size:12px;line-height:1.8}.muted-link{color:var(--red);font-size:12px}.progressbar{height:3px;border-radius:2px;background:#e9dfd0;margin:14px 0 23px}.progressbar i{display:block;width:65%;height:100%;background:#ae6978}details{margin:17px 0;font-size:12px}summary{cursor:pointer;color:var(--red);padding:9px 0}a{color:var(--red)}.reminder-options{padding:16px;background:#f1ebdf;border-radius:10px}.reminder-options label{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:12px}.reminder-options input{width:auto;accent-color:var(--red)}.file-label{cursor:pointer;color:var(--red);font-size:11px;padding:12px;display:inline-block}
@media(max-width:650px){header{padding:18px 20px}.brand{font-size:25px}main{padding:22px 18px 35px}h1{font-size:26px}.banner{font-size:10px;padding:12px 14px;margin-bottom:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:13px}.card h3{font-size:14px}.photo{height:115px}.grid>.card:only-child{grid-column:1/-1;display:grid;grid-template-columns:110px 1fr}.grid>.card:only-child .photo{height:100%;min-height:180px}.grid>.card:only-child .photo .tag{top:8px;right:5px;font-size:9px}.stats{gap:7px}.stat{padding:17px 8px}.stat span{font-size:10px}.hero-actions button{font-size:12px}.tabs button{padding:12px 10px;font-size:12px}.query-row{padding:16px;gap:8px}.query-row button{font-size:11px;padding:10px}.query-row h3{font-size:14px}.callout{padding:13px;font-size:11px}.section-head h2{font-size:17px}dialog{padding:21px;max-height:94dvh}.choice-stack button{padding:12px 8px}.actions{gap:5px}.actions button{padding:9px 7px}.version{font-size:9px}.toolbar select{max-width:115px;font-size:12px}}

/* Stable card slots: variable detail content belongs in the detail dialog. */
.grid{align-items:stretch}.grid>.card,.grid>.card:only-child{display:flex;flex-direction:column;grid-column:auto;min-width:0}.grid>.card .photo,.grid>.card:only-child .photo{height:130px;min-height:130px;flex:0 0 130px}.grid>.card .card-body,.grid>.card:only-child .card-body{display:flex;flex-direction:column;padding:18px;flex:1;min-width:0}.card .product-title,.grid>.card:only-child h3.product-title{height:48px;min-height:48px;margin:0 0 10px;line-height:24px}.product-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;text-align:left;font-weight:500;font-size:16px;line-height:24px;padding:0;border-radius:3px;width:100%;min-height:0;max-height:48px}.category-slot{display:flex;align-items:center;justify-content:space-between;gap:6px;height:30px;min-height:30px;margin-bottom:12px}.category-slot .tag{margin:0;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unclassified{background:#f3efe9;color:#a2978a}.details-link{font-size:10px;color:var(--muted);padding:5px 0 5px 5px;min-height:28px;white-space:nowrap}.card-facts{margin:0;height:84px;min-height:84px}.card-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:baseline;line-height:28px;font-size:11px}.card-row dt{color:#a08f7d}.card-row dd{margin:0;color:#776e63;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-query{height:32px;min-height:32px;line-height:32px;font-size:10px;color:var(--red);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:8px 0}.card-query.quiet{color:#b1a697}.query-link{padding:0;min-height:30px;font-size:11px;color:var(--red)}.card .actions{margin-top:auto;flex-wrap:nowrap;padding-top:8px}.card .actions button{min-width:0;white-space:nowrap}.detail-name{overflow-wrap:anywhere;line-height:1.7}.detail-facts{background:#f3eee5;padding:15px;border-radius:12px}.detail-facts .card-row{grid-template-columns:76px minmax(0,1fr);padding:8px 0;line-height:1.8}.detail-facts dd{white-space:normal;overflow-wrap:anywhere;overflow:visible}
@media(max-width:650px){.grid>.card .photo,.grid>.card:only-child .photo{height:110px;min-height:110px;flex-basis:110px}.grid>.card .card-body,.grid>.card:only-child .card-body{padding:12px}.product-name{font-size:14px}.card-row{grid-template-columns:25px minmax(0,1fr);gap:5px;font-size:10px}.card .actions button{font-size:10px;padding:9px 5px}.category-slot .tag{font-size:9px;padding:4px 6px}.category-slot{gap:2px}.details-link{font-size:9px}.card-query{font-size:9px}.grid>.card:only-child .photo .tag{right:10px;top:10px;font-size:10px;padding:5px 8px}}

<body>
<header><div class="brand">D.PAO<small>数字梳妆台</small></div><span class="version">整理模式 · 交互原型</span></header>
<main id="app"></main><dialog id="modal" aria-labelledby="modal-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// Standalone prototype. No network requests, production storage access or actual product advice.
const KEY='dpao_review_prototype_v1';
const CATEGORIES=['洁面','卸妆','化妆水','精华','乳液','面霜','眼部护理','面膜','防晒','身体护理','彩妆','其他'];
const $=s=>document.querySelector(s);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dayValue=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return NaN;const d=new Date(s+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===s?+d:NaN};
const ago=n=>new Date(dayValue(today())-n*86400000).toISOString().slice(0,10);
const after=n=>new Date(dayValue(today())+n*86400000).toISOString().slice(0,10);
const addMonths=(s,m)=>{const [y,mo,d]=s.split('-').map(Number),last=new Date(Date.UTC(y,mo+m,0));return new Date(Date.UTC(last.getUTCFullYear(),last.getUTCMonth(),Math.min(d,last.getUTCDate()))).toISOString().slice(0,10)};
let records=[],storageIssue='',readOnly=false;
try{records=validate(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){storageIssue='本原型的本地记录无法读取，已暂停保存以保护原数据。你仍可浏览页面。';readOnly=true}
const state={page:'home',scene:'existing',session:[],draft:null,edit:null,newSource:'direct',queryId:null,search:'',stockFilter:'all',archiveFilter:'all',photoBusy:false};
let toastTimer,previousFocus;
function validate(a){if(!Array.isArray(a))throw Error('备份不是有效的记录数组');const ids=new Set();return a.map(x=>{if(!x||typeof x!=='object'||typeof x.id!=='string'||!['active','unopened','empty','discarded'].includes(x.status)||!x.name&&!x.image)throw Error('存在无效记录');if(ids.has(x.id))throw Error('存在重复编号');ids.add(x.id);for(const k of ['openedDate','openedEarliest','openedLatest','packageExpiry','nextCheck'])if(x[k]&&!Number.isFinite(dayValue(x[k])))throw Error('记录包含无效日期');if(x.months!==null&&x.months!==undefined&&(!Number.isInteger(x.months)||x.months<1||x.months>120))throw Error('期限格式不正确');return {...x,name:typeof x.name==='string'?x.name.slice(0,100):'',category:typeof x.category==='string'?x.category.slice(0,30):'',image:typeof x.image==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(x.image)?x.image:null,query:['pending','official','similar','none','accepted','skipped'].includes(x.query)?x.query:null}})}
function persist(next){if(readOnly){toast('为保护无法读取的原数据，保存已暂停。请先导出原始备份。');return false}try{localStorage.setItem(KEY,JSON.stringify(next));records=next;return true}catch(e){toast('无法保存：浏览器存储不可用或空间不足。请检查权限并导出备份。');return false}}
function toast(s){clearTimeout(toastTimer);$('#toast').textContent=s;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function name(r){return r.name||'未命名产品（有照片）'}
function button(action,label,cls='',extra=''){return `<button type="button" data-action="${action}" class="${cls}" ${extra}>${label}</button>`}
function idAttr(id){return `data-id="${escape(id)}"`}
function queryLabel(q){return {pending:'模拟查询中',official:'模拟：品牌说明待确认',similar:'模拟：同类参考待确认',none:'演示：暂无可靠资料',accepted:'已采用模拟资料',skipped:'已跳过模拟资料'}[q]||''}
function timeLabel(r){return r.dateMode==='exact'||r.dateMode==='today'?`开封 ${r.openedDate}`:r.dateMode==='approximate'?`大概开封：${{'7-30':'一周至一个月前','30-90':'一到三个月前','90-180':'三到六个月前'}[r.range]||'估计范围'}（截至录入当天）`:'开封时间不详'}
function deadline(r){if(r.status==='unopened')return r.packageExpiry?`包装有效期 ${r.packageExpiry}`:'包装有效期待确认';if(!r.months)return '开封后期限未确认';if(!r.openedDate&&!r.openedEarliest)return '已记期限，开封时间未知';if(r.openedDate){const end=addMonths(r.openedDate,r.months);return dayValue(end)<dayValue(today())?`已超过填写期限（${end}）`:`按填写信息用至 ${end}`}const first=addMonths(r.openedEarliest,r.months),last=addMonths(r.openedLatest,r.months);return dayValue(last)<dayValue(today())?'按估计范围，已超过填写期限':dayValue(first)<dayValue(today())?'可能超过填写期限，请核实':'按估计范围，尚未超过填写期限'}
function resultType(r){return ['official','similar','none'].includes(r.query)?r.query:r.demoResult}
function mockType(index){return ['official','similar','none'][index%3]}
function fresh(scene){return {name:'',category:'',image:null,status:scene==='stock'?'unopened':'active',dateMode:scene==='new'?'today':'unknown',openedDate:scene==='new'?today():'',range:'30-90',paoMode:'unknown',months:'',packageExpiry:'',lookup:false,photoState:''}}
function modal(content,focus='input:not([type=hidden]),button'){const el=$('#modal');el.innerHTML=content;if(!el.open){previousFocus=document.activeElement;el.showModal()}el.querySelector(focus)?.focus()}
function closeModal(){if(state.photoBusy)return toast('照片正在处理，请稍等');$('#modal').close();state.queryId=null;previousFocus?.focus()}
function head(title,sub=''){return `<div class="dialog-head"><h2 id="modal-title">${title}</h2>${button('close','✕','','aria-label="关闭"')}</div>${sub?`<p class="hint">${sub}</p>`:''}`}
function render(){
 const active=records.filter(r=>r.status==='active'),stock=records.filter(r=>r.status==='unopened'),archived=records.filter(r=>['empty','discarded'].includes(r.status)),pending=records.filter(r=>['official','similar','none'].includes(r.query));
 let html=`<aside class="banner"><strong>交互原型 · 资料查询为模拟。</strong> 不提供真实产品期限建议。记录仅保存在此浏览器，与旧版应用独立。</aside>`;
 if(storageIssue)html+=`<div class="error" role="alert">${escape(storageIssue)}</div>`;
 if(state.page==='summary')html+=summaryPage();
 else if(state.page==='queries')html+=queriesPage();
 else{
 html+=`<div class="hero"><div class="eyebrow">A LITTLE CARE, EVERY DAY</div><h1>${state.page==='stock'?'还没开封，也心里有数。':state.page==='archive'?'每一瓶，都留下一个结尾。':'先整理，再慢慢照顾。'}</h1><p class="sub">${state.page==='stock'?'保留包装有效期，开封时直接转入梳妆台。':state.page==='archive'?'用完与停用分别记录，感受不必急着填写。':'从手边的一瓶开始，不记得的就先留空。'}</p><div class="hero-actions">${button('start','整理已有产品','primary')}${button('new','今天开了一瓶','secondary')}${button('demo','先体验示例','')}</div></div>`;
 html+=`<div class="stats"><div class="stat"><strong>${active.length}</strong><span>正在使用</span></div><div class="stat"><strong>${stock.length}</strong><span>尚未开封</span></div><div class="stat"><strong>${archived.length}</strong><span>使用档案</span></div></div>`;
 if(pending.length||records.some(r=>r.query==='pending'))html+=`<div class="callout"><span>${pending.length?`${pending.length} 瓶模拟资料待查看`:'模拟查询进行中'} · 不会自动修改期限</span>${button('queries','查看 →')}</div>`;
 if(state.session.length)html+=`<div class="callout"><span>这轮已收录 ${state.session.length} 瓶，随时可以结束。</span>${button('summary','查看整理小结 →')}</div>`;
 html+=`<nav class="tabs" aria-label="产品空间">${[['home','梳妆台'],['stock','囤货柜'],['archive','使用档案']].map(([p,t])=>button('nav',t,state.page===p?'selected':'',`data-page="${p}"`)).join('')}</nav>`;
 if(state.page==='archive')html+=`<div class="choices">${[['all','全部'],['empty','已用完'],['discarded','已停用']].map(([v,l])=>button('archiveFilter',l,state.archiveFilter===v?'chosen':'',`data-value="${v}"`)).join('')}</div>`;
 const list=(state.page==='stock'?stock:state.page==='archive'?archived:active).filter(r=>name(r).toLowerCase().includes(state.search.toLowerCase())&&(state.page!=='archive'||state.archiveFilter==='all'||r.status===state.archiveFilter));
 html+=`<div class="section-head"><h2>${state.page==='stock'?'未开封的瓶瓶罐罐':state.page==='archive'?'留下的使用记录':'已经开封的瓶瓶罐罐'}</h2>${state.page==='stock'?button('stockAdd','＋ 记录囤货','tint'):''}</div><div class="toolbar"><input id="search" aria-label="搜索产品" placeholder="搜索产品名称" value="${escape(state.search)}"></div>`;

function reminder(id){const r=records.find(x=>x.id===id);state.queryId=id;modal(head('资料与提醒，分开决定','这里只安排原型中的一次检查，不代表到期日，不发送后台通知。')+`<h3>${escape(name(r))}</h3><form id="reminder-form"><div class="reminder-options"><label><input type="radio" name="remind" value="no" checked>只保存模拟资料，不提醒</label><label><input type="radio" name="remind" value="yes">安排一次检查</label><label class="field">检查日期（选择安排检查时生效）<input name="date" aria-label="检查日期" type="date" min="${today()}" value="${r.nextCheck||after(7)}"></label></div><p class="hint">当开封时间未知时，这个日期只表示「再看一眼」，不能推算过期。</p><button class="primary wide" type="submit">确认保存模拟资料</button></form>`,'input')}
function archiveOptions(id){const r=records.find(x=>x.id===id);state.queryId=id;modal(head('这一瓶，接下来怎么处理？')+`<h3>${escape(name(r))}</h3>`+button('archiveEmpty','<strong>已经用完了</strong><span>先归档，回购感受可以稍后补写。</span>','scene',idAttr(id))+button('archiveDiscard','<strong>还没用完，决定停用</strong><span>可以记录超期、不适或其他原因。</span>','scene',idAttr(id)),'button')}
function review(id,status=null){const r=records.find(x=>x.id===id);state.queryId=id;modal(head(status==='discarded'||r.status==='discarded'?'停用原因':'用完后的感受','可以不填，之后再回来补。')+`<h3>${escape(name(r))}</h3><form id="archive-form" data-status="${status||r.status}"><label class="field">${status==='discarded'||r.status==='discarded'?'停用原因':'回购意愿'}<select name="feeling"><option value="">稍后再说</option>${(status==='discarded'||r.status==='discarded'?[['超期','超期'],['不适','不适'],['变质','变质'],['其他','其他']]:[['good','愿意回购'],['normal','无功无过'],['bad','不再回购']]).map(([v,l])=>`<option value="${v}" ${r.rating===v||r.stopReason===v?'selected':''}>${l}</option>`).join('')}</select></label><button type="submit" class="primary wide">保存归档</button></form>`,'select')}
function exportData(){try{const data=readOnly?(localStorage.getItem(KEY)||''):JSON.stringify({prototype:'dpao-review-v1',records},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`DPAO-prototype-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch{toast('无法读取本地记录，请检查浏览器权限')}}
function seedDemo(){if(!confirm('添加三瓶独立示例，不覆盖你已有的记录。查询结果均为模拟。继续吗？'))return;const examples=[{...fresh('existing'),id:uid(),name:'示例 A · 日期明确的面霜',category:'面霜',status:'active',dateMode:'exact',openedDate:ago(60),months:12,query:'official',demoResult:'official'},{...fresh('existing'),id:uid(),name:'示例 B · 记不清的精华',category:'精华',status:'active',dateMode:'approximate',range:'30-90',openedDate:null,openedEarliest:ago(90),openedLatest:ago(30),months:null,query:'similar',demoResult:'similar'},{...fresh('stock'),id:uid(),name:'示例 C · 还没开的乳液',category:'乳液',status:'unopened',packageExpiry:after(300),months:null,query:null}].map(r=>({...r,recordedDate:today()}));if(persist([...records,...examples])){state.session.push(...examples.map(r=>r.id));render();toast('已添加示例。可在「资料待确认」中体验不同结果。')}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id,value=target.dataset.value;syncDraft();switch(a){
 case 'close':closeModal();break;case 'start':case 'continue':start();break;case 'new':newBottle();break;case 'newDirect':begin('new');break;case 'chooseStock':chooseStock();break;case 'stockAdd':begin('stock');break;case 'scene':begin(target.dataset.scene);break;
 case 'nav':state.page=target.dataset.page;state.search='';render();break;case 'home':state.page='home';render();window.scrollTo(0,0);break;case 'queries':state.page='queries';render();window.scrollTo(0,0);break;case 'summary':case 'end':$('#modal').close();state.page='summary';render();window.scrollTo(0,0);break;case 'newSession':state.session=[];state.page='home';render();break;
 case 'dateMode':state.draft.dateMode=value;if(value==='today')state.draft.openedDate=today();drawForm();break;case 'paoMode':state.draft.paoMode=value;state.draft.lookup=value==='lookup';drawForm();break;case 'removePhoto':state.draft.image=null;drawForm();break;case 'saveEnd':saveRecord(true);break;
 case 'edit':{const r=records.find(x=>x.id===id);begin(r.status==='unopened'?'stock':'existing',r);state.draft.originalRange=r.range;break}case 'openStock':{const r=records.find(x=>x.id===id);begin('new',r,true);break}
 case 'details':showDetails(id);break;case 'result':showResult(id);break;case 'acceptResult':reminder(id);break;case 'skipResult':if(persist(records.map(r=>r.id===id?{...r,query:'skipped',reference:null,nextCheck:null}:r))){closeModal();render();toast('保留原记录，没有采用模拟资料')}break;
 case 'finishOptions':archiveOptions(id);break;case 'archiveEmpty':review(id,'empty');break;case 'archiveDiscard':review(id,'discarded');break;case 'review':review(id);break;case 'archiveFilter':state.archiveFilter=value;render();break;
 case 'export':exportData();break;case 'reset':if(confirm('只清空此交互原型的记录，不影响旧应用。建议先导出备份。确定清空吗？')){if(persist([])){state.session=[];render();toast('已清空原型记录')}}break;case 'demo':seedDemo();break;
}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='record-form')saveRecord();if(e.target.id==='reminder-form'){const data=new FormData(e.target),scheduled=data.get('remind')==='yes',date=data.get('date');if(scheduled&&(!Number.isFinite(dayValue(date))||date<today()))return toast('请填写今天或之后的检查日期');const id=state.queryId;if(persist(records.map(r=>r.id===id?{...r,demoResult:resultType(r),query:'accepted',reference:{demo:true,type:resultType(r)},nextCheck:scheduled?date:null}:r))){closeModal();render();toast('已保存模拟资料'+(scheduled?'及应用内检查日期':'，不安排提醒'))}}if(e.target.id==='archive-form'){const id=state.queryId,status=e.target.dataset.status,feeling=new FormData(e.target).get('feeling');if(persist(records.map(r=>r.id===id?{...r,status,archivedDate:r.archivedDate||today(),rating:status==='empty'?feeling:null,stopReason:status==='discarded'?feeling:null,nextCheck:null}:r))){closeModal();render();toast('已归档')}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}else if(e.target.dataset.field)syncDraft()});
document.addEventListener('change',async e=>{if(e.target.dataset.field)syncDraft();if(e.target.id==='photo'){const file=e.target.files[0];if(!file)return;const draft=state.draft;state.photoBusy=true;try{if(!file.type.startsWith('image/'))throw Error('请选择图片');const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);draft.image=canvas.toDataURL('image/jpeg',.75);bitmap.close()}catch{toast('照片无法读取，请换一张 JPG 或 PNG 图片')}finally{state.photoBusy=false;if(state.draft===draft)drawForm()}}
 if(e.target.id==='import'){const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.prototype!=='dpao-review-v1')throw Error('请导入本原型导出的备份，旧应用备份暂不兼容');const next=validate(data.records);if(!confirm(`将替换此原型的 ${records.length} 条记录为 ${next.length} 条。是否继续？`))return;localStorage.setItem(KEY,JSON.stringify(next));records=next;readOnly=false;storageIssue='';state.session=[];render();toast('原型备份已恢复')}catch(err){toast('导入失败：'+err.message)}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
// Simulate asynchronous return while this page is open; no actual network or background service.
setInterval(()=>{const pending=records.filter(r=>r.query==='pending');if(!pending.length||readOnly)return;const next=records.map(r=>r.query==='pending'?{...r,query:r.demoResult||'none'}:r);if(persist(next)){const searchFocused=document.activeElement?.id==='search';if(!searchFocused)render();toast('模拟资料已返回。未确认前不会修改期限。')}},3000);
render();
</script>
</body></html>
